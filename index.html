<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAPONEドルのWikipediaに飛ぶどぱおたくのランダム開封式😻</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(160deg, #fff0f7 0%, #f3e8ff 50%, #eef6ff 100%);
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 12px 32px rgba(120, 80, 180, 0.14);
      text-align: center;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.3rem;
      line-height: 1.45;
    }
    .sub {
      margin: 0 0 22px;
      font-size: 0.88rem;
      color: #666;
      line-height: 1.5;
    }
    .btn-all {
      width: 100%;
      padding: 16px 18px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff5ca8, #8b5cf6);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.3);
      transition: transform 0.12s ease, opacity 0.12s ease;
      margin-bottom: 18px;
    }
    .btn-all:active {
      transform: scale(0.98);
      opacity: 0.92;
    }
    .section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: #777;
      margin: 4px 0 10px;
      letter-spacing: 0.04em;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .btn-group {
      padding: 13px 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #333;
      background: #fff;
      border: 1.5px solid #e9d8fd;
      border-radius: 14px;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
    }
    .btn-group:active {
      transform: scale(0.97);
      background: #faf5ff;
    }
    .btn-ceo {
      margin-top: 10px;
      width: 100%;
      padding: 12px 10px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #6b21a8;
      background: #faf5ff;
      border: 1.5px dashed #d8b4fe;
      border-radius: 14px;
      cursor: pointer;
    }
    .btn-ceo:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 18px;
      font-size: 0.85rem;
      color: #6b21a8;
      min-height: 1.4em;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>LAPONEドルのWikipediaに飛ぶ<br>どぱおたくのランダム開封式😻</h1>
    <p class="sub">押すたびにランダムで誰かのWikipediaに飛ぶよ！🥺🙌🏻🍀<br>※まれにチェ社長が出ます</p>

    <button class="btn-all" onclick="goRandom('ALL')">✨ 全員からランダム開封する ✨</button>

    <div class="section-title">グループ別に開封</div>
    <div class="grid">
      <button class="btn-group" onclick="goRandom('JO1')">JO1</button>
      <button class="btn-group" onclick="goRandom('INI')">INI</button>
      <button class="btn-group" onclick="goRandom('DXTEEN')">DXTEEN</button>
      <button class="btn-group" onclick="goRandom('KO1KEYZ')">KO1KEYZ</button>
      <button class="btn-group" onclick="goRandom('ME:I')">ME:I</button>
      <button class="btn-group" onclick="goRandom('IS:SUE')">IS:SUE</button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <script>
    const GROUPS = {
      "JO1": [
        { label: "與那城奨", page: "與那城奨" },
        { label: "川尻蓮", page: "川尻蓮" },
        { label: "白岩瑠姫", page: "白岩瑠姫" },
        { label: "河野純喜", page: "河野純喜" },
        { label: "佐藤景瑚", page: "佐藤景瑚" },
        { label: "川西拓実", page: "川西拓実" },
        { label: "木全翔也", page: "木全翔也" },
        { label: "金城碧海", page: "金城碧海" },
        { label: "豆原一成", page: "豆原一成" }
      ],
      "INI": [
        { label: "池﨑理人", page: "池﨑理人" },
        { label: "尾崎匠海", page: "尾崎匠海" },
        { label: "木村柾哉", page: "木村柾哉" },
        { label: "後藤威尊", page: "後藤威尊" },
        { label: "佐野雄大", page: "佐野雄大" },
        { label: "許豊凡", page: "許豊凡" },
        { label: "髙塚大夢", page: "髙塚大夢" },
        { label: "田島将吾", page: "田島将吾" },
        { label: "西洸人", page: "西洸人" },
        { label: "藤牧京介", page: "藤牧京介" },
        { label: "松田迅", page: "松田迅" }
      ],
      "DXTEEN": [
        { label: "大久保波留", page: "大久保波留" },
        { label: "田中笑太郎", page: "田中笑太郎" },
        { label: "谷口太一", page: "谷口太一" },
        { label: "寺尾香信", page: "寺尾香信" },
        { label: "平本健", page: "平本健" },
        { label: "福田歩汰", page: "福田歩汰" }
      ],
      "KO1KEYZ": [
        { label: "安部結蘭", page: "安部結蘭" },
        { label: "飯塚亮賀", page: "飯塚亮賀" },
        { label: "オ・シンヘン", page: "オ・シンヘン" },
        { label: "小野慶人", page: "小野慶人" },
        { label: "加藤大樹", page: "加藤大樹" },
        { label: "後藤結", page: "後藤結" },
        { label: "杉山竜司", page: "杉山竜司" },
        { label: "照井康祐", page: "照井康祐" },
        { label: "パク・シヨン", page: "パク・シヨン" },
        { label: "濱田永遠", page: "濱田永遠" },
        { label: "矢田佳暉", page: "矢田佳暉" },
        { label: "柳谷伊冴", page: "柳谷伊冴" }
      ],
      "ME:I": [
        { label: "櫻井美羽", page: "櫻井美羽" },
        { label: "笠原桃奈", page: "笠原桃奈" },
        { label: "高見文寧", page: "高見文寧" },
        { label: "清水恵子", page: "清水恵子" },
        { label: "村上璃杏", page: "村上璃杏" },
        { label: "山本すず", page: "山本すず" },
        { label: "海老原鼓", page: "海老原鼓" }
      ],
      "IS:SUE": [
        { label: "RIN", page: "IS:SUE" },
        { label: "NANO", page: "IS:SUE" },
        { label: "YUUKI", page: "IS:SUE" },
        { label: "RINO", page: "IS:SUE" }
      ]
    };

    const CEO = { label: "チェ社長（崔信化）", page: "崔信化" };

    function goRandom(groupKey) {
      let pool = [];
      if (groupKey === "ALL") {
        Object.values(GROUPS).forEach(members => {
          pool = pool.concat(members);
        });
        pool.push(CEO);
      } else {
        pool = GROUPS[groupKey] || [];
      }

      if (pool.length === 0) return;

      const picked = pool[Math.floor(Math.random() * pool.length)];
      const statusEl = document.getElementById("status");
      statusEl.textContent = `🎉「${picked.label}」が出ました！移動中…`;

      const wikiUrl = `https://ja.wikipedia.org/wiki/${encodeURIComponent(picked.page)}`;
      setTimeout(() => {
        window.location.href = wikiUrl;
      }, 300);
    }
  </script>
</body>
</html>
