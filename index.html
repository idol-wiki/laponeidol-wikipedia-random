<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LAPONE ランダム Wikipedia</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(145deg, #f5f3ff 0%, #eef2ff 50%, #fdf2f8 100%);
      color: #1f2937;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 14px 36px rgba(79, 70, 229, 0.12);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: #5b21b6;
      background: #ede9fe;
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    .sub {
      font-size: 13px;
      color: #6b7280;
      margin: 0 0 22px;
    }
    .picked-box {
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 18px;
      padding: 20px 14px;
      margin-bottom: 20px;
    }
    .group-label {
      font-size: 12px;
      font-weight: 700;
      color: #7c3aed;
      margin-bottom: 6px;
    }
    .name-label {
      font-size: 26px;
      font-weight: 800;
      color: #111827;
      word-break: break-word;
    }
    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: linear-gradient(135deg, #6d28d9, #4f46e5);
      color: #ffffff;
      margin-bottom: 12px;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #1f2937;
    }
    .note {
      margin-top: 16px;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">RANDOM PICKER</div>
    <h1>LAPONE Wikipedia</h1>
    <p class="sub">ランダムで選ばれたページのWikipediaを開けるよ</p>

    <div class="picked-box">
      <div class="group-label" id="groupLabel">---</div>
      <div class="name-label" id="nameLabel">読み込み中...</div>
    </div>

    <a id="wikiLink" class="btn btn-primary" href="#" target="_blank" rel="noopener noreferrer">
      Wikipediaを開く
    </a>
    <button id="rerollBtn" class="btn btn-secondary" type="button">
      もう1回ランダムで引く
    </button>

    <p class="note">
      ※ページによってはWikipedia側の記事が存在しない場合があります。
    </p>
  </main>
